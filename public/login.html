<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Aplikasi Buat Satu Aplikasi Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #4F46E5;
            --accent-to: #22C55E;
        }
        .gradient-bg { background: linear-gradient(135deg, var(--accent-from), var(--accent-to)); }
        .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .input-field {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            width: 100%;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent-to);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.5);
        }
        .input-field::placeholder {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen gradient-bg">
    <div class="glass p-8 rounded-lg shadow-xl w-full max-w-md mx-auto">
        <h2 class="text-3xl font-bold text-center mb-6">Masuk</h2>
        <p class="text-center text-gray-300 mb-8">Aplikasi Buat Satu Aplikasi Enterprise</p>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-200 mb-2">Email</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="email@example.com" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-200 mb-2">Kata Sandi</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full gradient-bg text-white py-3 rounded-md font-semibold hover:opacity-90 transition-opacity">
                Masuk
            </button>
        </form>
        
        <div class="mt-8 text-center text-gray-300">
            <a href="#" class="text-sm hover:underline">Lupa Kata Sandi?</a>
            <p class="mt-4 text-sm">Belum punya akun? <a href="/register.html" class="font-medium text-white hover:underline">Daftar Sekarang</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.message || 'Login gagal. Silakan coba lagi.');
                }
            } catch (error) {
                console.error('Error during login:', error);
                alert('Terjadi kesalahan jaringan. Silakan coba lagi.');
            }
        });
    </script>
</body>
</html>
